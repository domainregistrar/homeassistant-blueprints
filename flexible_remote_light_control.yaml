      description: Optional colour mode for light turn_on / brightness actions
      default: none
      selector:
        select:
          options:
            - none
            - color_temp_kelvin
            - rgb_color

    left_button_color_temp_kelvin:
      name: Left button colour temperature (K)
      description: Used only if Left button colour mode = color_temp_kelvin
      default: 3000
      selector:
        color_temp:
          unit: kelvin
          min: 1500
          max: 9000

    left_button_rgb_color:
      name: Left button RGB colour
      description: Used only if Left button colour mode = rgb_color
      default: [255, 255, 255]
      selector:
        color_rgb: {}

    left_button_transition:
      name: Left button transition (seconds)
      description: Used for light actions and scene
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          unit_of_measurement: s

    left_button_scene:
      name: Left button scene
      description: Used only if Left button mode = scene
      default: []
      selector:
        entity:
          domain: scene

    left_button_script:
      name: Left button script
      description: Used only if Left button mode = script
      default: []
      selector:
        entity:
          domain: script

    right_button_mode:
      name: Right button mode
      description: Action for subtype "arrow_right_click"
      default: brightness_pct
      selector:
        select:
          options:
            - nothing
            - turn_on
            - turn_off
            - toggle
            - brightness_step
            - brightness_pct
            - scene
            - script

    right_button_step:
      name: Right button brightness step %
      description: Used only if Right button mode = brightness_step
