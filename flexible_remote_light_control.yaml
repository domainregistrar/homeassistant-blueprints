mode: queued
max: 10

trigger:
  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: "off"
    id: off_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: "on"
    id: on_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: arrow_left_click
    id: left_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: arrow_right_click
    id: right_button

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: off_button
        sequence:
          - variables:
              current_mode: !input off_button_mode
              current_step: !input off_button_step
              current_brightness: !input off_button_brightness
              current_apply_brightness_on_turn_on: !input off_button_apply_brightness_on_turn_on
              current_colour_mode: !input off_button_colour_mode
              current_color_temp_kelvin: !input off_button_color_temp_kelvin
              current_rgb_color: !input off_button_rgb_color
              current_transition: !input off_button_transition
              current_scene: !input off_button_scene
              current_script: !input off_button_script

      - conditions:
          - condition: trigger
            id: on_button
        sequence:
          - variables:
              current_mode: !input on_button_mode
              current_step: !input on_button_step
              current_brightness: !input on_button_brightness
              current_apply_brightness_on_turn_on: !input on_button_apply_brightness_on_turn_on
              current_colour_mode: !input on_button_colour_mode
              current_color_temp_kelvin: !input on_button_color_temp_kelvin
              current_rgb_color: !input on_button_rgb_color
              current_transition: !input on_button_transition
              current_scene: !input on_button_scene
              current_script: !input on_button_script

      - conditions:
          - condition: trigger
            id: left_button
        sequence:
          - variables:
              current_mode: !input left_button_mode
              current_step: !input left_button_step
              current_brightness: !input left_button_brightness
              current_apply_brightness_on_turn_on: !input left_button_apply_brightness_on_turn_on
              current_colour_mode: !input left_button_colour_mode
              current_color_temp_kelvin: !input left_button_color_temp_kelvin
              current_rgb_color: !input left_button_rgb_color
              current_transition: !input left_button_transition
              current_scene: !input left_button_scene
              current_script: !input left_button_script

      - conditions:
          - condition: trigger
            id: right_button
        sequence:
          - variables:
              current_mode: !input right_button_mode
              current_step: !input right_button_step
              current_brightness: !input right_button_brightness
              current_apply_brightness_on_turn_on: !input right_button_apply_brightness_on_turn_on
              current_colour_mode: !input right_button_colour_mode
              current_color_temp_kelvin: !input right_button_color_temp_kelvin
              current_rgb_color: !input right_button_rgb_color
              current_transition: !input right_button_transition
              current_scene: !input right_button_scene
              current_script: !input right_button_script

  - variables:
      pre_turn_on_workaround: !input pre_turn_on_workaround
      pre_turn_on_delay: !input pre_turn_on_delay

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'nothing' }}"
        sequence: []

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'turn_on' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not current_apply_brightness_on_turn_on and current_colour_mode == 'none' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ current_transition | float }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          transition: "{{ current_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ not current_apply_brightness_on_turn_on and current_colour_mode == 'color_temp_kelvin' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ current_transition | float }}"
                              color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          transition: "{{ current_transition | float }}"
                          color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"

              - conditions:
                  - condition: template
                    value_template: "{{ not current_apply_brightness_on_turn_on and current_colour_mode == 'rgb_color' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ current_transition | float }}"
                              rgb_color: "{{ current_rgb_color }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          transition: "{{ current_transition | float }}"
                          rgb_color: "{{ current_rgb_color }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_apply_brightness_on_turn_on and current_colour_mode == 'none' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ current_transition | float }}"
                              brightness_pct: "{{ current_brightness | int }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          transition: "{{ current_transition | float }}"
                          brightness_pct: "{{ current_brightness | int }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_apply_brightness_on_turn_on and current_colour_mode == 'color_temp_kelvin' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ current_transition | float }}"
                              brightness_pct: "{{ current_brightness | int }}"
                              color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          transition: "{{ current_transition | float }}"
                          brightness_pct: "{{ current_brightness | int }}"
                          color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_apply_brightness_on_turn_on and current_colour_mode == 'rgb_color' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ current_transition | float }}"
                              brightness_pct: "{{ current_brightness | int }}"
                              rgb_color: "{{ current_rgb_color }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          transition: "{{ current_transition | float }}"
                          brightness_pct: "{{ current_brightness | int }}"
                          rgb_color: "{{ current_rgb_color }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'turn_off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input target_light
            data:
              transition: "{{ current_transition | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'toggle' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'brightness_step' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_colour_mode == 'none' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ current_step | int }}"
                              transition: "{{ current_transition | float }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          brightness_step_pct: "{{ current_step | int }}"
                          transition: "{{ current_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_colour_mode == 'color_temp_kelvin' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ current_step | int }}"
                              transition: "{{ current_transition | float }}"
                              color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          brightness_step_pct: "{{ current_step | int }}"
                          transition: "{{ current_transition | float }}"
                          color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_colour_mode == 'rgb_color' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ current_step | int }}"
                              transition: "{{ current_transition | float }}"
                              rgb_color: "{{ current_rgb_color }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          brightness_step_pct: "{{ current_step | int }}"
                          transition: "{{ current_transition | float }}"
                          rgb_color: "{{ current_rgb_color }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'brightness_pct' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_colour_mode == 'none' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ current_brightness | int }}"
                              transition: "{{ current_transition | float }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          brightness_pct: "{{ current_brightness | int }}"
                          transition: "{{ current_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_colour_mode == 'color_temp_kelvin' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ current_brightness | int }}"
                              transition: "{{ current_transition | float }}"
                              color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          brightness_pct: "{{ current_brightness | int }}"
                          transition: "{{ current_transition | float }}"
                          color_temp_kelvin: "{{ current_color_temp_kelvin | int }}"

              - conditions:
                  - condition: template
                    value_template: "{{ current_colour_mode == 'rgb_color' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ pre_turn_on_workaround }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                          - delay:
                              milliseconds: "{{ (pre_turn_on_delay | float * 1000) | round(0) | int }}"
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ current_brightness | int }}"
                              transition: "{{ current_transition | float }}"
                              rgb_color: "{{ current_rgb_color }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input target_light
                        data:
                          brightness_pct: "{{ current_brightness | int }}"
                          transition: "{{ current_transition | float }}"
                          rgb_color: "{{ current_rgb_color }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'scene' and current_scene not in [none, '', []] }}"
        sequence:
          - action: scene.turn_on
            data:
              entity_id: "{{ current_scene }}"
              transition: "{{ current_transition | float }}"

      - conditions:
          - condition: template
            value_template: "{{ current_mode == 'script' and current_script not in [none, '', []] }}"
        sequence:
          - action: script.turn_on
            data:
              entity_id: "{{ current_script }}"
