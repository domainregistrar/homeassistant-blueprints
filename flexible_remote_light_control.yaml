                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: "{{ right_button_brightness | int }}"
                      transition: "{{ right_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if right_button_colour_mode == 'color_temp_kelvin' %}
                          {{ right_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if right_button_colour_mode == 'rgb_color' %}
                          {{ right_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ right_button_mode == 'scene' and right_button_scene not in [none, '', []] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input right_button_scene
                    data:
                      transition: "{{ right_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ right_button_mode == 'script' and right_button_script not in [none, '', []] }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: !input right_button_script
