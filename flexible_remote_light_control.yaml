mode: single

variables:
  target_light: !input target_light

  off_button_mode: !input off_button_mode
  off_button_step: !input off_button_step
  off_button_brightness: !input off_button_brightness
  off_button_apply_brightness_on_turn_on: !input off_button_apply_brightness_on_turn_on
  off_button_colour_mode: !input off_button_colour_mode
  off_button_color_temp_kelvin: !input off_button_color_temp_kelvin
  off_button_rgb_color: !input off_button_rgb_color
  off_button_transition: !input off_button_transition
  off_button_scene: !input off_button_scene
  off_button_script: !input off_button_script

  on_button_mode: !input on_button_mode
  on_button_step: !input on_button_step
  on_button_brightness: !input on_button_brightness
  on_button_apply_brightness_on_turn_on: !input on_button_apply_brightness_on_turn_on
  on_button_colour_mode: !input on_button_colour_mode
  on_button_color_temp_kelvin: !input on_button_color_temp_kelvin
  on_button_rgb_color: !input on_button_rgb_color
  on_button_transition: !input on_button_transition
  on_button_scene: !input on_button_scene
  on_button_script: !input on_button_script

  left_button_mode: !input left_button_mode
  left_button_step: !input left_button_step
  left_button_brightness: !input left_button_brightness
  left_button_apply_brightness_on_turn_on: !input left_button_apply_brightness_on_turn_on
  left_button_colour_mode: !input left_button_colour_mode
  left_button_color_temp_kelvin: !input left_button_color_temp_kelvin
  left_button_rgb_color: !input left_button_rgb_color
  left_button_transition: !input left_button_transition
  left_button_scene: !input left_button_scene
  left_button_script: !input left_button_script

  right_button_mode: !input right_button_mode
  right_button_step: !input right_button_step
  right_button_brightness: !input right_button_brightness
  right_button_apply_brightness_on_turn_on: !input right_button_apply_brightness_on_turn_on
  right_button_colour_mode: !input right_button_colour_mode
  right_button_color_temp_kelvin: !input right_button_color_temp_kelvin
  right_button_rgb_color: !input right_button_rgb_color
  right_button_transition: !input right_button_transition
  right_button_scene: !input right_button_scene
  right_button_script: !input right_button_script

triggers:
  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: "off"
    id: off_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: "on"
    id: on_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: arrow_left_click
    id: left_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: arrow_right_click
    id: right_button

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: off_button
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'nothing' }}"
                sequence: []

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'turn_on' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ off_button_transition | float }}"
                      brightness_pct: >
                        {% if off_button_apply_brightness_on_turn_on %}
                          {{ off_button_brightness | int }}
                        {% endif %}
                      color_temp_kelvin: >
                        {% if off_button_colour_mode == 'color_temp_kelvin' %}
                          {{ off_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if off_button_colour_mode == 'rgb_color' %}
                          {{ off_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'turn_off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ off_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input target_light

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'brightness_step' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_step_pct: "{{ off_button_step | int }}"
                      transition: "{{ off_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if off_button_colour_mode == 'color_temp_kelvin' %}
                          {{ off_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if off_button_colour_mode == 'rgb_color' %}
                          {{ off_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'brightness_pct' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: "{{ off_button_brightness | int }}"
                      transition: "{{ off_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if off_button_colour_mode == 'color_temp_kelvin' %}
                          {{ off_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if off_button_colour_mode == 'rgb_color' %}
                          {{ off_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'scene' and off_button_scene not in [none, '', []] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input off_button_scene
                    data:
                      transition: "{{ off_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'script' and off_button_script not in [none, '', []] }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: !input off_button_script

      - conditions:
          - condition: trigger
            id: on_button
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'nothing' }}"
                sequence: []

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'turn_on' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ on_button_transition | float }}"
                      brightness_pct: >
                        {% if on_button_apply_brightness_on_turn_on %}
                          {{ on_button_brightness | int }}
                        {% endif %}
                      color_temp_kelvin: >
                        {% if on_button_colour_mode == 'color_temp_kelvin' %}
                          {{ on_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if on_button_colour_mode == 'rgb_color' %}
                          {{ on_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'turn_off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ on_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input target_light

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'brightness_step' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_step_pct: "{{ on_button_step | int }}"
                      transition: "{{ on_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if on_button_colour_mode == 'color_temp_kelvin' %}
                          {{ on_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if on_button_colour_mode == 'rgb_color' %}
                          {{ on_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'brightness_pct' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: "{{ on_button_brightness | int }}"
                      transition: "{{ on_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if on_button_colour_mode == 'color_temp_kelvin' %}
                          {{ on_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if on_button_colour_mode == 'rgb_color' %}
                          {{ on_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'scene' and on_button_scene not in [none, '', []] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input on_button_scene
                    data:
                      transition: "{{ on_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'script' and on_button_script not in [none, '', []] }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: !input on_button_script

      - conditions:
          - condition: trigger
            id: left_button
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'nothing' }}"
                sequence: []

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'turn_on' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ left_button_transition | float }}"
                      brightness_pct: >
                        {% if left_button_apply_brightness_on_turn_on %}
                          {{ left_button_brightness | int }}
                        {% endif %}
                      color_temp_kelvin: >
                        {% if left_button_colour_mode == 'color_temp_kelvin' %}
                          {{ left_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if left_button_colour_mode == 'rgb_color' %}
                          {{ left_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'turn_off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ left_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input target_light

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'brightness_step' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_step_pct: "{{ left_button_step | int }}"
                      transition: "{{ left_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if left_button_colour_mode == 'color_temp_kelvin' %}
                          {{ left_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if left_button_colour_mode == 'rgb_color' %}
                          {{ left_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'brightness_pct' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness_pct: "{{ left_button_brightness | int }}"
                      transition: "{{ left_button_transition | float }}"
                      color_temp_kelvin: >
                        {% if left_button_colour_mode == 'color_temp_kelvin' %}
                          {{ left_button_color_temp_kelvin | int }}
                        {% endif %}
                      rgb_color: >
                        {% if left_button_colour_mode == 'rgb_color' %}
                          {{ left_button_rgb_color }}
                        {% endif %}

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'scene' and left_button_scene not in [none, '', []] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input left_button_scene
