blueprint:
  name: Flexible remote light control with scenes, scripts, and colour mode selector
  description: >
    Control a light from an MQTT device-trigger remote.
    Each button can independently do nothing, turn on, turn off, toggle,
    set brightness step, set brightness percent, activate a scene, or run a script.
    For light-on actions, you can optionally apply brightness, colour mode, and transition.

  domain: automation

  input:
    remote_device:
      name: Remote device
      description: The remote/button device to listen to
      selector:
        device: {}

    target_light:
      name: Target light
      description: The light entity to control for light-based actions
      selector:
        entity:
          domain: light

    off_button_mode:
      name: Off button mode
      description: Action for subtype "off"
      default: brightness_step
      selector:
        select:
          options:
            - nothing
            - turn_on
            - turn_off
            - toggle
            - brightness_step
            - brightness_pct
            - scene
            - script

    off_button_step:
      name: Off button brightness step %
      description: Used only if Off button mode = brightness_step
      default: -5
      selector:
        number:
          min: -100
          max: 100
          step: 1
          unit_of_measurement: "%"

    off_button_brightness:
      name: Off button brightness %
      description: Used for brightness_pct mode, or optionally with turn_on
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    off_button_apply_brightness_on_turn_on:
      name: Off button apply brightness on turn_on
      description: If enabled, turn_on will also apply the brightness % value below
      default: false
      selector:
        boolean: {}

    off_button_colour_mode:
      name: Off button colour mode
      description: Optional colour mode for light turn_on / brightness actions
      default: none
      selector:
        select:
          options:
            - none
            - color_temp_kelvin
            - rgb_color

    off_button_color_temp_kelvin:
      name: Off button colour temperature (K)
      description: Used only if Off button colour mode = color_temp_kelvin
      default: 2700
      selector:
        color_temp:
          unit: kelvin
          min: 1500
          max: 9000

    off_button_rgb_color:
      name: Off button RGB colour
      description: Used only if Off button colour mode = rgb_color
      default: [255, 255, 255]
      selector:
        color_rgb: {}

    off_button_transition:
      name: Off button transition (seconds)
      description: Used for light actions and scene
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          unit_of_measurement: s

    off_button_scene:
      name: Off button scene
      description: Used only if Off button mode = scene
      default: []
      selector:
        entity:
          domain: scene

    off_button_script:
      name: Off button script
      description: Used only if Off button mode = script
      default: []
      selector:
        entity:
          domain: script

    on_button_mode:
      name: On button mode
      description: Action for subtype "on"
      default: brightness_step
      selector:
        select:
          options:
            - nothing
            - turn_on
            - turn_off
            - toggle
            - brightness_step
            - brightness_pct
            - scene
            - script

    on_button_step:
      name: On button brightness step %
      description: Used only if On button mode = brightness_step
      default: 5
      selector:
        number:
          min: -100
          max: 100
          step: 1
          unit_of_measurement: "%"

    on_button_brightness:
      name: On button brightness %
      description: Used for brightness_pct mode, or optionally with turn_on
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    on_button_apply_brightness_on_turn_on:
      name: On button apply brightness on turn_on
      description: If enabled, turn_on will also apply the brightness % value below
      default: false
      selector:
        boolean: {}

    on_button_colour_mode:
      name: On button colour mode
      description: Optional colour mode for light turn_on / brightness actions
      default: none
      selector:
        select:
          options:
            - none
            - color_temp_kelvin
            - rgb_color

    on_button_color_temp_kelvin:
      name: On button colour temperature (K)
      description: Used only if On button colour mode = color_temp_kelvin
      default: 4000
      selector:
        color_temp:
          unit: kelvin
          min: 1500
          max: 9000

    on_button_rgb_color:
      name: On button RGB colour
      description: Used only if On button colour mode = rgb_color
      default: [255, 255, 255]
      selector:
        color_rgb: {}

    on_button_transition:
      name: On button transition (seconds)
      description: Used for light actions and scene
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          unit_of_measurement: s

    on_button_scene:
      name: On button scene
      description: Used only if On button mode = scene
      default: []
      selector:
        entity:
          domain: scene

    on_button_script:
      name: On button script
      description: Used only if On button mode = script
      default: []
      selector:
        entity:
          domain: script

    left_button_mode:
      name: Left button mode
      description: Action for subtype "arrow_left_click"
      default: turn_off
      selector:
        select:
          options:
            - nothing
            - turn_on
            - turn_off
            - toggle
