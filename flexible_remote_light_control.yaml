            - brightness_pct
            - scene
            - script

    left_button_step:
      name: Left button brightness step %
      description: Used only if Left button mode = brightness_step
      default: -10
      selector:
        number:
          min: -100
          max: 100
          step: 1
          unit_of_measurement: "%"

    left_button_brightness:
      name: Left button brightness %
      description: Used for brightness_pct mode, or optionally with turn_on
      default: 25
      selector:
        number:
          min: 1
          max: 100
          step: 1
