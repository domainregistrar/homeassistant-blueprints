blueprint:
  name: Flexible remote light control
  description: >
    Control a light from an MQTT device-trigger remote.
    Each button can independently do nothing, turn on, turn off, toggle,
    set brightness step, set brightness percent, activate a scene, or run a script.
    For light-on actions, you can optionally apply brightness, colour mode, and transition.
    Optional workaround: send a plain turn_on first, wait briefly, then send the
    parameterised turn_on.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    general_settings:
      name: General
      icon: mdi:cog
      description: Core device and target light settings.
      collapsed: false
      input:
        remote_device:
          name: Remote device
          description: The remote/button device to listen to
          selector:
            device: {}

        target_light:
          name: Target light
          description: The light entity to control for light-based actions
          selector:
            entity:
              domain: light

        pre_turn_on_workaround:
          name: Pre-turn-on workaround
          description: >
            If enabled, any light turn_on action first sends a plain turn_on with no
            parameters, waits briefly, then sends the full turn_on with brightness,
            colour and/or transition.
          default: false
          selector:
            boolean: {}

        pre_turn_on_delay:
          name: Pre-turn-on delay (seconds)
          description: Delay between the plain turn_on and the parameterised turn_on
          default: 0.2
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s

    off_button_section:
      name: ⏬ Off button
      icon: mdi:chevron-down
      description: Settings for subtype "off"
      collapsed: true
      input:
        off_button_mode:
          name: Mode
          default: brightness_step
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        off_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: -5
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        off_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        off_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on also applies the brightness % above
          default: false
          selector:
            boolean: {}

        off_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        off_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        off_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        off_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        off_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        off_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

    on_button_section:
      name: ⏫ On button
      icon: mdi:chevron-up
      description: Settings for subtype "on"
      collapsed: true
      input:
        on_button_mode:
          name: Mode
          default: brightness_step
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        on_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: 5
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        on_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        on_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on also applies the brightness % above
          default: false
          selector:
            boolean: {}

        on_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        on_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        on_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        on_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        on_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        on_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

    left_button_section:
      name: ⬅️ Left button
      icon: mdi:arrow-left
      description: Settings for subtype "arrow_left_click"
      collapsed: true
      input:
        left_button_mode:
          name: Mode
          default: turn_off
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        left_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: -10
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        left_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 25
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        left_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on also applies the brightness % above
          default: false
          selector:
            boolean: {}

        left_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        left_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 3000
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        left_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        left_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        left_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        left_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

    right_button_section:
      name: ➡️ Right button
      icon: mdi:arrow-right
      description: Settings for subtype "arrow_right_click"
      collapsed: true
      input:
        right_button_mode:
          name: Mode
          default: brightness_pct
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        right_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: 10
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        right_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        right_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on also applies the brightness % above
          default: false
          selector:
            boolean: {}

        right_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        right_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 2200
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        right_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        right_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        right_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        right_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
