blueprint:
  name: Flexible remote light control
  description: >
    Control a light from an MQTT device-trigger remote.
    Each button can independently do nothing, turn on, turn off, toggle,
    set brightness step, set brightness percent, activate a scene, or run a script.
    For light-on actions, you can optionally apply brightness, colour mode, and transition.

  domain: automation

  input:
    general_settings:
      name: General
      description: Core device and target light settings.
      collapsed: false
      input:
        remote_device:
          name: Remote device
          description: The remote/button device to listen to
          selector:
            device: {}

        target_light:
          name: Target light
          description: The light entity to control for light-based actions
          selector:
            entity:
              domain: light

    off_button_section:
      name: ⏬ Off button
      description: Settings for subtype "off"
      collapsed: true
      input:
        off_button_mode:
          name: Mode
          default: brightness_step
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        off_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: -5
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        off_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        off_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on will also apply the brightness % value above
          default: false
          selector:
            boolean: {}

        off_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        off_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        off_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        off_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        off_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        off_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

    on_button_section:
      name: ⏫ On button
      description: Settings for subtype "on"
      collapsed: true
      input:
        on_button_mode:
          name: Mode
          default: brightness_step
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        on_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: 5
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        on_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        on_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on will also apply the brightness % value above
          default: false
          selector:
            boolean: {}

        on_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        on_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        on_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        on_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        on_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        on_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

    left_button_section:
      name: ⬅️ Left button
      description: Settings for subtype "arrow_left_click"
      collapsed: true
      input:
        left_button_mode:
          name: Mode
          default: turn_off
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        left_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: -10
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        left_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 25
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        left_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on will also apply the brightness % value above
          default: false
          selector:
            boolean: {}

        left_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        left_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 3000
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        left_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        left_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        left_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        left_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

    right_button_section:
      name: ➡️ Right button
      description: Settings for subtype "arrow_right_click"
      collapsed: true
      input:
        right_button_mode:
          name: Mode
          default: brightness_pct
          selector:
            select:
              options:
                - nothing
                - turn_on
                - turn_off
                - toggle
                - brightness_step
                - brightness_pct
                - scene
                - script

        right_button_step:
          name: Brightness step %
          description: Used only if mode = brightness_step
          default: 10
          selector:
            number:
              min: -100
              max: 100
              step: 1
              unit_of_measurement: "%"

        right_button_brightness:
          name: Brightness %
          description: Used if mode = brightness_pct, or optionally with turn_on
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        right_button_apply_brightness_on_turn_on:
          name: Apply brightness on turn_on
          description: If enabled, turn_on will also apply the brightness % value above
          default: false
          selector:
            boolean: {}

        right_button_colour_mode:
          name: Colour mode
          description: Optional colour mode for turn_on / brightness actions
          default: none
          selector:
            select:
              options:
                - none
                - color_temp_kelvin
                - rgb_color

        right_button_color_temp_kelvin:
          name: Colour temperature (K)
          description: Used only if colour mode = color_temp_kelvin
          default: 2200
          selector:
            color_temp:
              unit: kelvin
              min: 1500
              max: 9000

        right_button_rgb_color:
          name: RGB colour
          description: Used only if colour mode = rgb_color
          default: [255, 255, 255]
          selector:
            color_rgb: {}

        right_button_transition:
          name: Transition (seconds)
          description: Used for light actions and scene
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 0.5
              unit_of_measurement: s

        right_button_scene:
          name: Scene
          description: Used only if mode = scene
          default: []
          selector:
            entity:
              domain: scene

        right_button_script:
          name: Script
          description: Used only if mode = script
          default: []
          selector:
            entity:
              domain: script

mode: single

variables:
  off_button_mode: !input off_button_mode
  off_button_step: !input off_button_step
  off_button_brightness: !input off_button_brightness
  off_button_apply_brightness_on_turn_on: !input off_button_apply_brightness_on_turn_on
  off_button_colour_mode: !input off_button_colour_mode
  off_button_color_temp_kelvin: !input off_button_color_temp_kelvin
  off_button_rgb_color: !input off_button_rgb_color
  off_button_transition: !input off_button_transition
  off_button_scene: !input off_button_scene
  off_button_script: !input off_button_script

  on_button_mode: !input on_button_mode
  on_button_step: !input on_button_step
  on_button_brightness: !input on_button_brightness
  on_button_apply_brightness_on_turn_on: !input on_button_apply_brightness_on_turn_on
  on_button_colour_mode: !input on_button_colour_mode
  on_button_color_temp_kelvin: !input on_button_color_temp_kelvin
  on_button_rgb_color: !input on_button_rgb_color
  on_button_transition: !input on_button_transition
  on_button_scene: !input on_button_scene
  on_button_script: !input on_button_script

  left_button_mode: !input left_button_mode
  left_button_step: !input left_button_step
  left_button_brightness: !input left_button_brightness
  left_button_apply_brightness_on_turn_on: !input left_button_apply_brightness_on_turn_on
  left_button_colour_mode: !input left_button_colour_mode
  left_button_color_temp_kelvin: !input left_button_color_temp_kelvin
  left_button_rgb_color: !input left_button_rgb_color
  left_button_transition: !input left_button_transition
  left_button_scene: !input left_button_scene
  left_button_script: !input left_button_script

  right_button_mode: !input right_button_mode
  right_button_step: !input right_button_step
  right_button_brightness: !input right_button_brightness
  right_button_apply_brightness_on_turn_on: !input right_button_apply_brightness_on_turn_on
  right_button_colour_mode: !input right_button_colour_mode
  right_button_color_temp_kelvin: !input right_button_color_temp_kelvin
  right_button_rgb_color: !input right_button_rgb_color
  right_button_transition: !input right_button_transition
  right_button_scene: !input right_button_scene
  right_button_script: !input right_button_script

triggers:
  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: "off"
    id: off_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: "on"
    id: on_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: arrow_left_click
    id: left_button

  - trigger: device
    device_id: !input remote_device
    domain: mqtt
    type: action
    subtype: arrow_right_click
    id: right_button

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: off_button
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'nothing' }}"
                sequence: []

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'turn_on' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ off_button_transition | float }}"
                              brightness_pct: >
                                {% if off_button_apply_brightness_on_turn_on %}
                                  {{ off_button_brightness | int }}
                                {% endif %}
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'color_temp_kelvin' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ off_button_transition | float }}"
                              brightness_pct: >
                                {% if off_button_apply_brightness_on_turn_on %}
                                  {{ off_button_brightness | int }}
                                {% endif %}
                              color_temp_kelvin: "{{ off_button_color_temp_kelvin | int }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'rgb_color' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ off_button_transition | float }}"
                              brightness_pct: >
                                {% if off_button_apply_brightness_on_turn_on %}
                                  {{ off_button_brightness | int }}
                                {% endif %}
                              rgb_color: !input off_button_rgb_color

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'turn_off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ off_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input target_light

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'brightness_step' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ off_button_step | int }}"
                              transition: "{{ off_button_transition | float }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'color_temp_kelvin' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ off_button_step | int }}"
                              transition: "{{ off_button_transition | float }}"
                              color_temp_kelvin: "{{ off_button_color_temp_kelvin | int }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'rgb_color' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ off_button_step | int }}"
                              transition: "{{ off_button_transition | float }}"
                              rgb_color: !input off_button_rgb_color

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'brightness_pct' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ off_button_brightness | int }}"
                              transition: "{{ off_button_transition | float }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'color_temp_kelvin' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ off_button_brightness | int }}"
                              transition: "{{ off_button_transition | float }}"
                              color_temp_kelvin: "{{ off_button_color_temp_kelvin | int }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ off_button_colour_mode == 'rgb_color' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ off_button_brightness | int }}"
                              transition: "{{ off_button_transition | float }}"
                              rgb_color: !input off_button_rgb_color

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'scene' and off_button_scene not in [none, '', []] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input off_button_scene
                    data:
                      transition: "{{ off_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ off_button_mode == 'script' and off_button_script not in [none, '', []] }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: !input off_button_script

      - conditions:
          - condition: trigger
            id: on_button
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'nothing' }}"
                sequence: []

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'turn_on' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ on_button_transition | float }}"
                              brightness_pct: >
                                {% if on_button_apply_brightness_on_turn_on %}
                                  {{ on_button_brightness | int }}
                                {% endif %}
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'color_temp_kelvin' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ on_button_transition | float }}"
                              brightness_pct: >
                                {% if on_button_apply_brightness_on_turn_on %}
                                  {{ on_button_brightness | int }}
                                {% endif %}
                              color_temp_kelvin: "{{ on_button_color_temp_kelvin | int }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'rgb_color' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              transition: "{{ on_button_transition | float }}"
                              brightness_pct: >
                                {% if on_button_apply_brightness_on_turn_on %}
                                  {{ on_button_brightness | int }}
                                {% endif %}
                              rgb_color: !input on_button_rgb_color

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'turn_off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ on_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'toggle' }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: !input target_light

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'brightness_step' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ on_button_step | int }}"
                              transition: "{{ on_button_transition | float }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'color_temp_kelvin' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ on_button_step | int }}"
                              transition: "{{ on_button_transition | float }}"
                              color_temp_kelvin: "{{ on_button_color_temp_kelvin | int }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'rgb_color' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_step_pct: "{{ on_button_step | int }}"
                              transition: "{{ on_button_transition | float }}"
                              rgb_color: !input on_button_rgb_color

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'brightness_pct' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ on_button_brightness | int }}"
                              transition: "{{ on_button_transition | float }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'color_temp_kelvin' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ on_button_brightness | int }}"
                              transition: "{{ on_button_transition | float }}"
                              color_temp_kelvin: "{{ on_button_color_temp_kelvin | int }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ on_button_colour_mode == 'rgb_color' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
                              brightness_pct: "{{ on_button_brightness | int }}"
                              transition: "{{ on_button_transition | float }}"
                              rgb_color: !input on_button_rgb_color

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'scene' and on_button_scene not in [none, '', []] }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: !input on_button_scene
                    data:
                      transition: "{{ on_button_transition | float }}"

              - conditions:
                  - condition: template
                    value_template: "{{ on_button_mode == 'script' and on_button_script not in [none, '', []] }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: !input on_button_script

      - conditions:
          - condition: trigger
            id: left_button
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'nothing' }}"
                sequence: []

              - conditions:
                  - condition: template
                    value_template: "{{ left_button_mode == 'turn_on' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ left_button_colour_mode == 'none' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input target_light
                            data:
